<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curiosidades</title>
    <style>
        /* Configurações Globais */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Times New Roman', Times, serif;
        }

        body {
            background-color: #ffffff;
            color: #333333;
        }

        /* Cabeçalho (Header) */
        header {
            background-color: orange;
            color: #ffffff;
            text-align: center;
            padding: 40px 20px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            font-weight: bold;
        }

        header p {
            font-size: 1.2rem;
            font-weight: normal;
        }

        /* Container dos Posts */
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Estrutura de cada Post */
        .post {
            display: flex;
            align-items: flex-start;
            margin-bottom: 40px;
        }

        /* Ícone do Post */
        .post-icon {
            font-size: 3rem;
            margin-right: 20px;
            margin-top: 5px;
            user-select: none;
        }

        /* Conteúdo de Texto do Post */
        .post-content h2 {
            color: #1a4373;
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .post-author {
            font-weight: bold;
            color: #1a4373;
            margin-bottom: 12px;
            font-size: 1.1rem;
        }

        .post-text {
            font-size: 1.1rem;
            line-height: 1.4;
            color: #444444;
            margin-bottom: 15px;
        }

        /* Botões de Reação (Likes) */
        .reactions {
            display: flex;
            gap: 10px;
        }

        .btn-reaction {
            display: flex;
            align-items: center;
            gap: 6px;
            background-color: #f0f0f0;
            border: 1px solid #cccccc;
            padding: 4px 10px;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 2px;
            font-family: Arial, sans-serif;
            transition: all 0.2s ease;
        }

        .btn-reaction:hover {
            background-color: #e5e5e5;
        }
        
        /* Estilo visual para quando o botão estiver ATIVADO (curtido) */
        .btn-reaction.active {
            background-color: #e1ecf4;
            border-color: #7aa7c7;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>Conhecimentos gerais</h1>
        <p>vou introduzir coriosidades aqui de vez em quando</p>
    </header>

    <div class="container">

        <article class="post">
            <div class="post-icon">📘</div>
            <div class="post-content">
                <h2>Coração do polvo:</h2>
                <p class="post-author">Por: Caio Miguel</p>
                <p class="post-text">
                    o polvo tem três corações
                </p>
                <div class="reactions">
                    <button class="btn-reaction" onclick="alternarCurtida(this)">💖 <span>0</span></button>
                    <button class="btn-reaction" onclick="alternarCurtida(this)">👍 <span>1</span></button>
                </div>
            </div>
        </article>

        <article class="post">
            <div class="post-icon">📘</div>
            <div class="post-content">
                <h2>Chuva espacial:</h2>
                <p class="post-author">Por: Caio Miguel</p>
                <p class="post-text">
                     nos planetas Saturno e Jupter ocorre um fenômeno, que é a chuva de diamantes
                </p>
                <div class="reactions">
                    <button class="btn-reaction" onclick="alternarCurtida(this)">💖 <span>0</span></button>
                    <button class="btn-reaction" onclick="alternarCurtida(this)">👍 <span>0</span></button>
                </div>
            </div>
        </article>

    </div>

    <script>
        function alternarCurtida(botao) {
            // Seleciona o número dentro do botão
            const tagContador = botao.querySelector('span');
            let contagemAtual = parseInt(tagContador.innerText);
            
            // Verifica se o botão já tem a classe 'active' (se já foi clicado antes)
            if (botao.classList.contains('active')) {
                // Se já estava ativo, o usuário está "descurtindo": remove a classe e subtrai 1
                botao.classList.remove('active');
                tagContador.innerText = contagemAtual - 1;
            } else {
                // Se não estava ativo, o usuário está "curtindo": adiciona a classe e soma 1
                botao.classList.add('active');
                tagContador.innerText = contagemAtual + 1;
            }
        }
    </script>

</body>
</html>
